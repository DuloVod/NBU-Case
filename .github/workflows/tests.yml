name: Research checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  models-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Model equations, information sets and original data integrity
        run: python -m unittest discover -s tests -v
      - name: Rebuild numerical data from saved originals
        run: python tools/rebuild_data.py --check
      - name: Reproduce three-month research offline and verify saved results
        run: |
          python tools/run_research.py
          python tools/verify_short_term.py
      - name: Reproduce conditional shock decisions and verify sources offline
        run: |
          python models/conditional_policy.py
          python models/make_conditional_report.py
          python tools/verify_conditional_policy.py
